<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhisperX Highlight Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.7;
            background-color: #faf9f6;
            color: #222;
        }

        h2 {
            margin-bottom: 8px;
        }

        .player-box {
            position: sticky;
            top: 0;
            background: #faf9f6;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 24px;
        }

        audio {
            width: 100%;
        }

        #transcript {
            font-size: 1.15rem;
        }

        /* Sentence highlight bookmark */
        .cue {
            transition: background-color 0.2s ease, opacity 0.2s ease;
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
        }

        .cue:hover {
            text-decoration: underline;
        }

        .cue.active {
            background-color: rgba(198, 93, 59, 0.18);
            border-left: 3px solid #C65D3B;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <h2>WhisperX Highlight Test</h2>
    <p style="color: #666; font-size: 0.9rem;">
        Hit Play to watch sentence tracking, or click any sentence to seek directly to it.
    </p>

    <div class="player-box">
        <audio id="audio" controls src="audio_output/introduction.mp3"></audio>
    </div>

    <div id="transcript">Loading cues...</div>

    <script>
        const audio = document.getElementById('audio');
        const transcript = document.getElementById('transcript');

        // 1. Fetch the WhisperX cues
        fetch('audio_output/introduction_cues.json')
            .then(res => res.json())
            .then(cues => {
                transcript.innerHTML = '';

                // 2. Render each cue with data attributes
                cues.forEach((cue, index) => {
                    const span = document.createElement('span');
                    span.className = 'cue';
                    span.id = `cue-${index}`;
                    span.dataset.start = cue.start;
                    span.dataset.end = cue.end;
                    span.textContent = cue.text + ' ';
                    transcript.appendChild(span);
                });

                // 3. Sync highlighting on timeupdate
                audio.addEventListener('timeupdate', () => {
                    const now = audio.currentTime;
                    const cueElements = transcript.querySelectorAll('.cue');

                    cueElements.forEach(el => {
                        const start = parseFloat(el.dataset.start);
                        const end = parseFloat(el.dataset.end);
                        if (now >= start && now <= end) {
                            el.classList.add('active');
                        } else {
                            el.classList.remove('active');
                        }
                    });
                });

                // 4. Tap-to-seek: clicking any sentence seeks audio immediately
                transcript.addEventListener('click', (e) => {
                    const clicked = e.target.closest('.cue');
                    if (clicked && clicked.dataset.start) {
                        audio.currentTime = parseFloat(clicked.dataset.start);
                        audio.play();
                    }
                });
            })
            .catch(err => {
                transcript.textContent = 'Failed to load cues: ' + err;
            });
    </script>
</body>

</html>
